<?xml version="1.0" encoding="UTF-8"?>
<!-- Board markers for cca play: an original drawing, part of CCA (Apache-2.0).
     It uses the element ids of cm-chessboard's marker sprite so that cm-chessboard's
     Markers extension can draw from it (cm-chessboard's own markers.svg is CC BY-SA 3.0
     and is not shipped). Colours come from css/app.css. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="cca-check-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#e31b1b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a80000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="markerSquare"><rect x="0" y="0" width="40" height="40"/></g>
  <g id="markerFrame"><rect x="1.25" y="1.25" width="37.5" height="37.5" fill="none"/></g>
  <g id="markerDot"><circle cx="20" cy="20" r="6.2"/></g>
  <g id="markerBevel"><path fill-rule="evenodd" d="M0 0H40V40H0Z M20 2A18 18 0 1 0 20 38A18 18 0 1 0 20 2Z"/></g>
  <g id="markerCircle"><circle cx="20" cy="20" r="17" fill="none"/></g>
  <g id="markerCircleFilled"><circle cx="20" cy="20" r="17"/></g>
  <g id="markerCheck"><rect x="0" y="0" width="40" height="40" fill="url(#cca-check-glow)"/></g>
</svg>
