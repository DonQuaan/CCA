name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: full CI (matrix, hygiene, Stockfish, audit)
    uses: ./.github/workflows/ci.yml

  verify:
    name: release gate
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.13"
      - name: Tag must be annotated and its commit must be on main
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: uv sync --frozen
      - name: Tag must equal package version and have a CHANGELOG entry
        run: uv run python scripts/check_release.py "${GITHUB_REF_NAME}"
      - run: uv build
      - run: uv run python scripts/check_release.py "${GITHUB_REF_NAME}" --notes > RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            dist/*
            RELEASE_NOTES.md

  publish:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job can write, and only after the gate passed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
