name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not engine and not maia2" --cov=cca --cov-report=xml

  stockfish:
    name: integration with real Stockfish 19
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Fetch Stockfish 19 (SHA-256 pinned in engines/stockfish.lock.json)
        run: uv run python scripts/fetch_stockfish.py --os linux --arch x86-64
      - name: Engine tests
        run: |
          export CCA_STOCKFISH="$(find engines -type f -name 'stockfish-linux-x86-64-universal' | head -n1)"
          chmod +x "$CCA_STOCKFISH"
          uv run cca doctor --stockfish "$CCA_STOCKFISH"
          uv run pytest -m engine -v

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --no-hashes -o requirements-audit.txt
      - run: uv run pip-audit -r requirements-audit.txt --strict
