# Install once: uv run pre-commit install --install-hooks -t pre-commit -t pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # Fixers never touch vendored third-party files: they must stay byte-identical to upstream
      # (SHA-256 pinned in src/cca/play/static/vendor/MANIFEST.json and re-checked by the tests).
      - id: end-of-file-fixer
        exclude: ^src/cca/play/static/vendor/
      - id: trailing-whitespace
        exclude: ^src/cca/play/static/vendor/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512", "--enforce-all"] # also files already in the tree (CI runs --all-files)
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '(\.bat$|^src/cca/play/static/vendor/)'
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-fast
        name: pytest (fast)
        entry: uv run pytest -q -m "not slow and not engine and not maia2" -x
        language: system
        pass_filenames: false
        stages: [pre-push]
